name: Validate Companion v3 rewrite

on:
  push:
    branches:
      - rewrite/companion-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
